<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a1a">
  <title>Fridge Analyzer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- SCREEN: HOME -->
  <div id="screen-home" class="screen active">
    <div class="hero">
      <div class="hero-icon">❄️</div>
      <h1>Fridge<br>Analyzer</h1>
      <p class="subtitle">Diagnosi salute frigo via analisi audio</p>
    </div>
    <div class="card info-card">
      <p>Posiziona il telefono vicino al frigo e premi il pulsante. Verranno registrati 15 secondi di audio per la diagnosi.</p>
    </div>
    <button id="btn-start" class="btn btn-primary">Inizia Analisi</button>
  </div>

  <!-- SCREEN: RECORDING -->
  <div id="screen-recording" class="screen">
    <div class="rec-container">
      <div id="countdown" class="countdown">3</div>

      <div id="rec-indicator" class="rec-indicator hidden">
        <div class="pulse-ring"></div>
        <div class="pulse-dot">REC</div>
      </div>

      <div class="waveform" id="waveform"></div>

      <div id="progress-wrap" class="progress-wrap hidden">
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="rec-status" class="rec-status"></p>
      </div>
    </div>
  </div>

  <!-- SCREEN: RESULTS -->
  <div id="screen-results" class="screen">
    <div class="card result-header">
      <div id="res-icon" class="res-icon">✅</div>
      <h2 id="res-status" class="res-status">NORMALE</h2>
      <p id="res-desc" class="res-desc">Frigo in buono stato</p>
      <div class="conf-track">
        <div id="conf-fill" class="conf-fill"></div>
      </div>
      <p id="conf-text" class="conf-text">Confidenza: 80%</p>
    </div>

    <div class="card">
      <h3 class="section-title">Indicatori</h3>
      <div id="indicators"></div>
    </div>

    <div class="card">
      <h3 class="section-title">Raccomandazioni</h3>
      <ul id="recommendations"></ul>
    </div>

    <button id="btn-retry" class="btn btn-secondary">Nuova Analisi</button>
  </div>

</div>
<script src="js/analyzer.js"></script>
<script src="js/classifier.js"></script>
<script src="js/app.js"></script>
</body>
</html>
